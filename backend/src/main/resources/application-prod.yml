# 운영(배포) 프로파일 — PostgreSQL. 배포 단계에서 활성화한다(SPRING_PROFILES_ACTIVE=prod).
# 민감 값은 환경변수로 주입한다 (NFR-02: 시크릿 분리).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/honjeong}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:honjeong}
    # 비밀값에는 기본값을 두지 않는다 — compose가 DB_PASSWORD를 항상 주입하므로(:? 가드로 필수화)
    # 런타임 영향은 없지만, 기본값이 있으면 이 값을 안 줘도 "그럴듯하게" 뜬다는 거짓을 이 파일이
    # 말하게 된다. 미설정 시 부팅이 즉시 실패해야 정직하다.
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true

# 운영 기본값은 연동별로 다르다 — 실제로 뜨는 값을 적는다(키는 환경변수로 주입).
# oauth·push는 real(구현체가 있다). sms는 아직 real 구현체가 없어 mock이 기본이다
# (근거는 아래 항목 주석). real 구현이 생기면 그때 기본값을 올린다.
honjeong:
  oauth:
    # ★이 기본값은 OAUTH_MODE 환경변수 한 줄로 덮인다(2026-07-27에 실제로 그렇게 덮였다).
    # 그래서 값 자체를 OAuthRealModeCheck가 부팅에서 확인한다 — 배포 프로파일에서 real이 아니면
    # 기동에 실패한다. mock은 소셜 ID 토큰을 검증하지 않는다는 뜻이다.
    mode: ${OAUTH_MODE:real}
  sms:
    # real 구현체(SMS 게이트웨이 연동)가 아직 없다. 여기에 real을 기본값으로 두면
    # mock 빈이 등록되지 않아 컨텍스트가 죽는다(부팅 불가) — 실제로 뜨는 값을 적는다.
    # 실사용자 오픈 시 real 구현 후 기본값을 real로 올릴 것. 그때까지 인증번호는 고정값이다.
    mode: ${SMS_MODE:mock}
  # 푸시는 real 구현체(FcmPushSender)가 있으므로 운영 기본값이 real이다.
  # 자격증명이 없으면 기동에 실패한다 — 조용히 mock으로 떨어지면 "배포는 됐는데 푸시만 안 가는"
  # 상태가 되고 그건 실기기에서야 드러난다.
  push:
    mode: ${PUSH_MODE:real}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
  apple:
    # ★real이 기본이다. 자격증명이 비어 있으면 부팅에 실패한다 — 조용히 mock으로 떨어지면
    # "배포는 됐는데 탈퇴 시 애플 토큰만 안 지워지는" 상태가 되고, 그건 심사에서야 드러난다.
    # push(FCM)와 같은 fail-closed 방식이다.
    # ★그래서 배포 전에 서버 .env에 APPLE_* 넷을 반드시 채워야 한다(안 채우면 크래시 루프).
    mode: ${APPLE_MODE:real}

server:
  port: 8080
