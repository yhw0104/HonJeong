spring:
  application:
    name: honjeong-api
  profiles:
    active: local

---
# 로컬 개발 프로파일 (H2, Docker 불필요)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/honjeong;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080
