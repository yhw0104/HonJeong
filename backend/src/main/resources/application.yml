spring:
  application:
    name: honjeong-api
  profiles:
    active: local
  servlet:
    multipart:
      # 업로드 이미지 크기 상한(기본 1MB는 사진엔 작다).
      max-file-size: 5MB
      max-request-size: 5MB

# 애플리케이션 고유 설정 (모든 프로파일 공통 — prod에서 일부 override)
honjeong:
  # 외부 연동 모드: mock(기본) | real. real은 환경변수 OAUTH_MODE=real로 켠다.
  oauth:
    mode: ${OAUTH_MODE:mock}
    kakao:
      # ID 토큰의 aud로 기대하는 값(카카오 콘솔 앱 키). 로컬은 backend/.env에서 주입.
      app-key: ${KAKAO_APP_KEY:}
      issuer: https://kauth.kakao.com
      jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
  # 애플 로그인. issuer·jwks-uri는 애플 고정값이고, client-id는 ID 토큰의 aud로 기대하는 번들 ID다.
  apple:
    client-id: ${APPLE_CLIENT_ID:com.honjeong.app}
    issuer: https://appleid.apple.com
    jwks-uri: https://appleid.apple.com/auth/keys
  sms:
    mode: mock
  files:
    # 파일 저장 모드: mock(로컬 디렉터리) | real(S3 등). real은 후속 구현.
    mode: mock
    local-dir: ./uploads                  # mock 저장 위치
    # mock 반환 URL 접두사(WebConfig 정적 서빙과 일치). 배포 시 FILES_BASE_URL로 공개 주소를 주입한다 —
    # 이 값이 localhost로 남으면 폰에서 사진이 열리지 않는다.
    base-url: ${FILES_BASE_URL:http://localhost:8080/files}
  # 푸시 발송 모드: mock(기본, 발송 안 함) | real(FCM). real은 FIREBASE_CREDENTIALS_BASE64가 필요하다.
  push:
    mode: ${PUSH_MODE:mock}
    credentials-base64: ${FIREBASE_CREDENTIALS_BASE64:}
    # 이 기간 재등록이 없으면 주인 없는 토큰으로 보고 지운다. 짧게 잡으면 휴면 사용자의
    # 푸시가 끊겨 앱을 열 이유가 없어진다(그래서 Firebase도 넉넉히 잡으라고 권고한다).
    staleness-days: 60
    sweep-interval-ms: 86400000           # 청소 스케줄러 주기(24시간)
  jwt:
    # HS256 서명 시크릿(>= 256bit). 환경변수 JWT_SECRET으로 주입한다(NFR-02).
    # ★기본값을 두지 않는다 — 여기에 값을 적으면 그 값이 저장소에 커밋되어, 저장소를 볼 수 있는
    #   누구나 임의 사용자를 사칭하는 토큰을 위조할 수 있다. 값이 없으면 바인딩 단계에서 즉시
    #   부팅에 실패한다(조용히 뜨는 것보다 낫다).
    # 개발용 값은 local·test 프로파일이 각자 들고 있다(아래 local 문서 / application-test.yml).
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: 3600        # 1시간
    refresh-token-ttl-seconds: 1209600    # 14일
    onboarding-token-ttl-seconds: 900     # 15분
  checkin:
    ttl-hours: 3                          # 방치된 ACTIVE 자동 만료 기준(NFR-07)
    expiry-interval-ms: 300000            # 만료 스케줄러 주기(5분)
    together-ttl-hours: 3                 # 같이먹기(TOGETHER) 만료 기준(matched_at 기준 시간)

---
# 로컬 개발 프로파일 (PostgreSQL via docker-compose: `docker compose up -d db`)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/honjeong
    driver-class-name: org.postgresql.Driver
    username: honjeong
    password: honjeong
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 소유
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

honjeong:
  jwt:
    # 로컬 개발 전용 시크릿. 공통 섹션이 기본값을 두지 않으므로 여기서 채운다 —
    # `./gradlew bootRun`은 .env를 읽지 않아(Gradle에 dotenv 로딩이 없다) 환경변수가 비어 있다.
    # 이 값은 개발 편의용이고 운영에는 절대 쓰이지 않는다(prod 프로파일은 JWT_SECRET을 요구한다).
    secret: honjeong-local-dev-secret-not-for-production-0123456789

server:
  port: 8080
