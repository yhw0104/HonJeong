spring:
  application:
    name: honjeong-api
  profiles:
    active: local
  servlet:
    multipart:
      # 업로드 이미지 크기 상한(기본 1MB는 사진엔 작다).
      max-file-size: 5MB
      max-request-size: 5MB

# 애플리케이션 고유 설정 (모든 프로파일 공통 — prod에서 일부 override)
honjeong:
  # 외부 연동 모드: mock(기본) | real. real은 환경변수 OAUTH_MODE=real로 켠다.
  oauth:
    mode: ${OAUTH_MODE:mock}
    kakao:
      # ID 토큰의 aud로 기대하는 값(카카오 콘솔 앱 키). 로컬은 backend/.env에서 주입.
      app-key: ${KAKAO_APP_KEY:}
      issuer: https://kauth.kakao.com
      jwks-uri: https://kauth.kakao.com/.well-known/jwks.json
  sms:
    mode: mock
  files:
    # 파일 저장 모드: mock(로컬 디렉터리) | real(S3 등). real은 후속 구현.
    mode: mock
    local-dir: ./uploads                  # mock 저장 위치
    # mock 반환 URL 접두사(WebConfig 정적 서빙과 일치). 배포 시 FILES_BASE_URL로 공개 주소를 주입한다 —
    # 이 값이 localhost로 남으면 폰에서 사진이 열리지 않는다.
    base-url: ${FILES_BASE_URL:http://localhost:8080/files}
  geo:
    # 역지오코딩 모드: mock(기본·결정론적 더미) | real(외부 역지오코딩 API). real은 후속 구현.
    mode: mock
  jwt:
    # HS256용 시크릿(>= 256bit). 운영은 환경변수 JWT_SECRET으로 주입(NFR-02).
    secret: ${JWT_SECRET:honjeong-local-dev-secret-please-change-in-production-0123456789}
    access-token-ttl-seconds: 3600        # 1시간
    refresh-token-ttl-seconds: 1209600    # 14일
    onboarding-token-ttl-seconds: 900     # 15분
  checkin:
    ttl-hours: 3                          # 방치된 ACTIVE 자동 만료 기준(NFR-07)
    expiry-interval-ms: 300000            # 만료 스케줄러 주기(5분)
    together-ttl-hours: 3                 # 같이먹기(TOGETHER) 만료 기준(matched_at 기준 시간)

---
# 로컬 개발 프로파일 (PostgreSQL via docker-compose: `docker compose up -d db`)
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://localhost:5432/honjeong
    driver-class-name: org.postgresql.Driver
    username: honjeong
    password: honjeong
  jpa:
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 소유
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

server:
  port: 8080
