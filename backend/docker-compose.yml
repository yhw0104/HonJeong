# 운영/통합 환경용. 배포 단계에서 사용한다.
# 로컬 개발은 H2를 쓰므로 지금은 실행하지 않아도 된다.
# 사용 예: docker compose up -d
services:
  db:
    image: postgres:17
    container_name: honjeong-db
    # DB 세션 기본 타임존을 KST로 — psql에서 now()를 써도 스키마 관례(KST naive)와 일치.
    command: postgres -c timezone=Asia/Seoul
    environment:
      POSTGRES_DB: honjeong
      POSTGRES_USER: honjeong
      POSTGRES_PASSWORD: honjeong
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - honjeong-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: honjeong-app
    depends_on:
      - db
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/honjeong
      DB_USERNAME: honjeong
      DB_PASSWORD: honjeong
      # 카카오 실검증 스위치. prod 프로파일(application-prod.yml)이 이미 OAUTH_MODE 기본값을
      # real로 선언하므로, 여기서 다른 기본값을 주면 그 선언을 덮어써 mock으로 조용히 뜬다.
      # 그래서 기본값도 real로 맞춘다 — 호스트가 값을 안 주면 real, 그런데 KAKAO_APP_KEY가
      # 비어 있으면 부팅 시점에 실패한다(KakaoOAuthVerifier 참고) — 조용한 인증 우회를 막기 위함.
      KAKAO_APP_KEY: ${KAKAO_APP_KEY:-}
      OAUTH_MODE: ${OAUTH_MODE:-real}
    ports:
      - "8080:8080"

volumes:
  honjeong-db-data:
