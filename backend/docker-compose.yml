# 운영/통합 환경용. 배포 단계에서 사용한다.
# 로컬 개발에서 DB만 띄울 때도 이 파일을 쓴다: docker compose up -d db
# 값은 backend/.env에서 주입한다(.env.example 참고). 비밀값에 기본값을 두지 않는다.
services:
  db:
    image: postgres:17
    container_name: honjeong-db
    # 컨테이너가 죽거나(OOM 등) 호스트가 재부팅해도 자동으로 다시 뜨게 한다. 기본값(no)이면
    # Lightsail이 재시작될 때 Docker 데몬은 살아나도 이 컨테이너들은 멈춰 있는 채로 남는다 —
    # 서비스가 "상시 동작"해야 한다는 배포 완료 기준을 기본값(no)으로는 못 지킨다.
    restart: unless-stopped
    # DB 세션 기본 타임존을 KST로 — psql에서 now()를 써도 스키마 관례(KST naive)와 일치.
    command: postgres -c timezone=Asia/Seoul
    environment:
      POSTGRES_DB: honjeong
      POSTGRES_USER: honjeong
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 backend/.env에 설정하세요}
      TZ: Asia/Seoul
    # 루프백에만 바인딩한다. 외부에서는 닿지 않고, 로컬 개발(bootRun·TablePlus·psql)은 그대로 동작한다.
    # 컨테이너 간 통신은 내부망(db:5432)이라 이 설정과 무관하다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - honjeong-db-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: honjeong-app
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # ★JVM 기본 타임존을 KST로 고정한다. 없으면 컨테이너가 UTC로 떠서, 앱이 쓰는
      # LocalDateTime.now()가 DB(Asia/Seoul)·로컬 개발(맥 KST)과 9시간 어긋난다.
      # 스키마 관례가 "KST naive"라 이 값이 곧 저장되는 시각이 된다 — 어긋나면
      # 화면 표시가 9시간 과거가 되고, "오늘 혼밥 N명"의 날짜 경계가 밀리며,
      # 운영자가 psql에서 now()로 넣은 공지 published_at을 앱이 미래로 읽어 노출하지 않는다.
      # ★로컬(bootRun)·로컬 compose는 호스트가 KST라 이 결함이 드러나지 않는다 — 배포에서만 난다.
      TZ: Asia/Seoul
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/honjeong
      DB_USERNAME: honjeong
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 backend/.env에 설정하세요}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET을 backend/.env에 설정하세요}
      # 업로드 사진의 공개 URL 접두사. FILES_BASE_URL을 직접 안 주면 DOMAIN에서 유도한다
      # (DOMAIN도 없으면 localhost) — 그래서 서버에서 맞출 값은 DOMAIN 하나뿐이다. DOMAIN만
      # 바꾸고 FILES_BASE_URL을 깜빡하면 서버는 뜨지만 사진 URL만 조용히 옛 값(또는 localhost)을
      # 가리키는 사고를 원천 차단한다.
      FILES_BASE_URL: ${FILES_BASE_URL:-https://${DOMAIN:-localhost}/files}
      # 카카오 실검증 스위치. prod 프로파일(application-prod.yml)이 이미 OAUTH_MODE 기본값을
      # real로 선언하므로, 여기서 다른 기본값을 주면 그 선언을 덮어써 mock으로 조용히 뜬다.
      # 그래서 기본값도 real로 맞춘다 — 호스트가 값을 안 주면 real, 그런데 KAKAO_APP_KEY가
      # 비어 있으면 부팅 시점에 실패한다(KakaoOAuthVerifier 참고) — 조용한 인증 우회를 막기 위함.
      KAKAO_APP_KEY: ${KAKAO_APP_KEY:-}
      OAUTH_MODE: ${OAUTH_MODE:-real}
      # 푸시 발송 스위치. 위 OAUTH_MODE와 같은 이유로 기본값을 real로 맞춘다 —
      # prod 프로파일(application-prod.yml)이 이미 PUSH_MODE 기본값을 real로 선언하므로
      # 여기서 다른 기본값을 주면 그 선언을 덮어써 조용히 mock으로 뜬다(푸시가 안 가는데
      # 서버는 멀쩡해 보인다). 자격증명이 비어 있으면 FcmPushSender 생성자가 부팅을
      # 실패시킨다 — KAKAO_APP_KEY와 동일한 fail-closed 방식이다.
      # ★이 두 줄이 없으면 컨테이너에 값이 전달되지 않는다. compose의 .env는 compose 파일
      # 보간용일 뿐 컨테이너 환경변수로 자동 전달되지 않기 때문이다.
      PUSH_MODE: ${PUSH_MODE:-real}
      FIREBASE_CREDENTIALS_BASE64: ${FIREBASE_CREDENTIALS_BASE64:-}
    # 호스트 포트를 열지 않는다 — Caddy가 내부망(app:8080)으로 접근한다.
    volumes:
      # 업로드 사진 영속화. 없으면 컨테이너 재생성 시 사진이 전량 소실된다.
      # Dockerfile의 WORKDIR가 /app이고 honjeong.files.local-dir이 ./uploads라 이 경로가 된다.
      - honjeong-uploads:/app/uploads

  caddy:
    image: caddy:2
    container_name: honjeong-caddy
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # 미지정이면 localhost — Caddy가 내부 인증서를 발급해 로컬에서도 https로 검증할 수 있다.
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 법무 문서(개인정보 처리방침 등) 정적 서빙. Caddyfile의 `root * /srv`가 이 경로를 가리키므로
      # /legal/privacy.html → ./legal/privacy.html 이 된다. 읽기 전용으로 붙인다.
      - ./legal:/srv/legal:ro
      # 인증서 영속화. 없으면 컨테이너를 다시 만들 때마다 재발급을 요청해 발급 한도에 걸릴 수 있다.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  honjeong-db-data:
  honjeong-uploads:
  caddy-data:
  caddy-config:
